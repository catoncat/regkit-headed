[project]
name = "regkit-headed"
version = "0.1.0"
description = "Real-Chrome automation primitives for pages behind Cloudflare Turnstile: background launch, CDP patch, Turnstile loop, mailbox OTP, in-page API capture."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["DrissionPage>=4.1"]

[project.urls]
Homepage = "https://github.com/catoncat/regkit-headed"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["regkit_headed"]
